name: host-release

# DISABLED for tag pushes: macOS binaries must be signed + notarized, and the
# Developer ID cert lives only on the maintainer's Mac. Releases are built
# there (host/scripts/build-release.sh signs + notarizes) and uploaded to Blob
# via `bun run scripts/upload-blob.ts <version>`. Re-enable the tag trigger
# once signing credentials land in CI secrets — until then this Linux runner
# would clobber Blob with unsigned darwin binaries (Gatekeeper kills those
# when downloaded by a browser).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install host deps
        working-directory: host
        run: bun install --frozen-lockfile

      - name: Build release binaries (+ gzip)
        working-directory: host
        run: bash scripts/build-release.sh

      - name: Upload to Vercel Blob
        working-directory: host
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: bun run scripts/upload-blob.ts "${GITHUB_REF_NAME#host-v}"
