name: Extension build sync

# Fails the PR when the committed extension/ directory doesn't match what
# extension-source/ currently produces. Run extension-source/scripts/export-extension.sh
# and commit the result to fix.

on:
  pull_request:
    paths:
      - 'extension-source/**'
      - 'extension/**'
      - '.github/workflows/extension-sync.yml'
  push:
    branches: [main]
    paths:
      - 'extension-source/**'
      - 'extension/**'
      - '.github/workflows/extension-sync.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension-source/pnpm-lock.yaml

      - name: Install extension-source deps
        working-directory: extension-source
        run: pnpm install --frozen-lockfile

      - name: Rebuild extension/ from extension-source/
        run: bash extension-source/scripts/export-extension.sh

      - name: Verify extension/ is in sync
        run: |
          if ! git diff --exit-code -- extension/; then
            echo ""
            echo "::error::extension/ is stale. Run 'bash extension-source/scripts/export-extension.sh' locally and commit the result."
            exit 1
          fi
