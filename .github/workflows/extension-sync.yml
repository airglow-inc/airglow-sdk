name: Extension build sync

# Fails when extension-source/ has changed since extension/ was last built.
# Uses the source-hash stamped in extension/manifest.json (airglow_build_hash)
# — no full rebuild required, so the check is independent of OS/toolchain.

on:
  pull_request:
    paths:
      - 'extension-source/**'
      - 'extension/**'
      - '.github/workflows/extension-sync.yml'
  push:
    branches: [main]
    paths:
      - 'extension-source/**'
      - 'extension/**'
      - '.github/workflows/extension-sync.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify extension/ matches extension-source/
        run: |
          expected=$(git ls-files extension-source/ | sort | xargs -I {} git hash-object {} | shasum -a 256 | awk '{print $1}')
          stamped=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['airglow_build_hash'])")
          if [ "$expected" != "$stamped" ]; then
            echo "::error::extension/ is stale (source hash $expected, stamped $stamped). Run 'bash extension-source/scripts/export-extension.sh' and commit."
            exit 1
          fi
          echo "extension/ is in sync (source hash $expected)"
