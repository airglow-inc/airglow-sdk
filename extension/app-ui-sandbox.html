<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airglow app</title>
  <style>
    html, body, #root {
      min-height: 100%;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    var bootNonce = new URLSearchParams(window.location.search).get('nonce') || '';
    function handleBootstrap(event) {
      if (event.source !== window.parent) return;
      var data = event.data || {};
      if (data.type !== 'airglow:ui:run') return;
      if (!bootNonce || data.nonce !== bootNonce) return;
      window.removeEventListener('message', handleBootstrap);
      try {
        document.title = data.appId || 'Airglow app';
        new Function(String(data.sdk || '') + '\n//# sourceURL=airglow-sdk://' + data.appId)();
        new Function(String(data.code || '') + '\n//# sourceURL=airglow-app://' + data.appId)();
      } catch (error) {
        window.parent.postMessage({
          _airglow_app_error: true,
          appId: data.appId,
          kind: 'ui_bundle_execution_failed',
          name: error && error.name,
          message: error && error.message ? error.message : String(error),
          stack: error && error.stack,
        }, '*');
      }
    }
    window.addEventListener('message', handleBootstrap);
  </script>
</body>
</html>
