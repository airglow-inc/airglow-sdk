<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
// Sandbox for running app startup scripts.
// Receives { type: 'airglow:startup:run', appId, code, sdk } from parent.
// Injects the standard airglow SDK, evals the code, reports done.

window.addEventListener('message', async function(event) {
  var data = event.data || {};
  if (data.type !== 'airglow:startup:run') return;

  try {
    new Function(data.sdk)();
    var fn = new Function('return (async () => {\n' + data.code + '\n})();');
    await fn();
    window.parent.postMessage({ type: 'airglow:startup:done', appId: data.appId, ok: true }, '*');
  } catch (e) {
    window.parent.postMessage({ type: 'airglow:startup:done', appId: data.appId, ok: false, error: e.message }, '*');
  }
});

window.parent.postMessage({ type: 'airglow:startup:ready' }, '*');
</script>
</body>
</html>
