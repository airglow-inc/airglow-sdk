<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Focus Hider Clock — Before / After</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root {
  --gray-000: #ffffff;
  --gray-050: #f9f8f3;
  --gray-100: #f3f2ea;
  --gray-150: #edece3;
  --gray-200: #e5e3d9;
  --gray-300: #ceccc2;
  --gray-500: #84837c;
  --gray-700: #3a3a37;
  --gray-750: #2d2d2b;
  --gray-950: #111110;
  --clay: #dc7a5a;
  --error: #b83636;
  --bg-primary: var(--gray-050);
  --bg-white: var(--gray-000);
  --fg-primary: var(--gray-950);
  --fg-tertiary: var(--gray-500);
  --border-tertiary: var(--gray-200);
  --border-secondary: var(--gray-300);
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
body {
  margin: 0; background: #1a1a2e; font-family: Inter, system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 40px;
}
.clock-wrap { margin-bottom: 40px; }
h1.title { font-size: 32px; font-weight: 700; margin: 0 0 12px; color: #f0f0f0; letter-spacing: -0.02em; text-align: center; }
p.schedule { font-size: 18px; line-height: 1.5; color: #9ca3af; margin: 0; text-align: center; }
p.schedule span { color: #6366f1; font-weight: 600; }
.time-display { font-family: 'JetBrains Mono', monospace; font-size: 48px; font-weight: 300; color: #6366f1; margin-top: 32px; letter-spacing: 2px; text-align: center; }
</style>
</head>
<body>

<div class="clock-wrap">
  <svg width="200" height="200" viewBox="0 0 200 200" id="clock"></svg>
</div>
<h1 class="title">Gmail is paused</h1>
<p class="schedule">Your feed is hidden — stay focused on what matters.</p>
<div class="time-display" id="time-display"></div>

<script>
const svg = document.getElementById('clock');
const markers = [];
for (let i = 0; i < 12; i++) {
  const a = (i * 30 - 90) * Math.PI / 180;
  markers.push(`<line x1="${100+80*Math.cos(a)}" y1="${100+80*Math.sin(a)}" x2="${100+88*Math.cos(a)}" y2="${100+88*Math.sin(a)}" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>`);
}
for (let i = 0; i < 60; i++) {
  if (i % 5 === 0) continue;
  const a = (i * 6 - 90) * Math.PI / 180;
  markers.push(`<line x1="${100+84*Math.cos(a)}" y1="${100+84*Math.sin(a)}" x2="${100+88*Math.cos(a)}" y2="${100+88*Math.sin(a)}" stroke="#3a3a5a" stroke-width="1" stroke-linecap="round"/>`);
}
const startDeg = ((11 % 12) * 30 - 90) * Math.PI / 180;
const endDeg = ((2 % 12) * 30 - 90) * Math.PI / 180;
let sweep = endDeg - startDeg;
if (sweep <= 0) sweep += 2 * Math.PI;
const as = {x: 100+75*Math.cos(startDeg), y: 100+75*Math.sin(startDeg)};
const ae = {x: 100+75*Math.cos(startDeg+sweep), y: 100+75*Math.sin(startDeg+sweep)};
const la = sweep > Math.PI ? 1 : 0;
const arcPath = `M ${as.x} ${as.y} A 75 75 0 ${la} 1 ${ae.x} ${ae.y}`;

svg.innerHTML = `
  <circle cx="100" cy="100" r="95" fill="#252545" stroke="#2a2a4a" stroke-width="2"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#2a2a4a" stroke-width="0.5"/>
  ${markers.join('')}
  <path d="${arcPath}" fill="none" stroke="rgba(239, 68, 68, 0.15)" stroke-width="12"/>
  <line class="hour-hand" x1="100" y1="100" x2="100" y2="50" stroke="#e0e0e0" stroke-width="3.5" stroke-linecap="round"/>
  <line class="minute-hand" x1="100" y1="100" x2="100" y2="35" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round"/>
  <line class="second-hand" x1="100" y1="100" x2="100" y2="30" stroke="#6366f1" stroke-width="1" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="4" fill="#6366f1"/>
  <circle cx="100" cy="100" r="4" fill="#6366f1" opacity="0.5">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
`;

const hhEl = svg.querySelector('.hour-hand');
const mhEl = svg.querySelector('.minute-hand');
const shEl = svg.querySelector('.second-hand');

function tick() {
  const now = new Date();
  const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds(), ms = now.getMilliseconds();
  const ha = (h * 30 + m * 0.5 - 90) * Math.PI / 180;
  const ma = (m * 6 + s * 0.1 - 90) * Math.PI / 180;
  const sa = ((s + ms / 1000) * 6 - 90) * Math.PI / 180;

  if (hhEl) { hhEl.setAttribute('x2', 100+45*Math.cos(ha)); hhEl.setAttribute('y2', 100+45*Math.sin(ha)); }
  if (mhEl) { mhEl.setAttribute('x2', 100+60*Math.cos(ma)); mhEl.setAttribute('y2', 100+60*Math.sin(ma)); }
  if (shEl) { shEl.setAttribute('x2', 100+60*Math.cos(sa)); shEl.setAttribute('y2', 100+60*Math.sin(sa)); }
  document.getElementById('time-display').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
